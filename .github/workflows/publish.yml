# publish workflow: version -> build-cli matrix -> publish
name: publish
run-name: "release ${{ inputs.bump || inputs.version || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch (takes precedence unless version is set)"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override the release version (e.g. 0.1.14). Takes precedence over bump."
        required: false
        type: string

concurrency:
  group: publish-${{ inputs.version || inputs.bump || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "ci@mimo.ai"
          git config --global user.name "mimo-ci"

      - name: Compute version, bump package.json files, create draft release
        id: version
        run: bun script/version.ts
        env:
          MIMOCODE_BUMP: ${{ inputs.bump }}
          MIMOCODE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-arm64
          - linux-x64
          - linux-x64-baseline
          - linux-arm64-musl
          - linux-x64-musl
          - linux-x64-baseline-musl
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - windows-arm64
          - windows-x64
          - windows-x64-baseline
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI binary and upload release asset
        run: bun packages/opencode/script/build.ts
        env:
          MIMOCODE_VERSION: ${{ needs.version.outputs.version }}
          MIMOCODE_RELEASE: ${{ needs.version.outputs.release }}
          MIMOCODE_TARGETS: ${{ matrix.target }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MIMO_FDS_AK: ${{ secrets.MIMO_FDS_AK }}
          MIMO_FDS_SK: ${{ secrets.MIMO_FDS_SK }}
          MIMO_FDS_ENDPOINT: ${{ secrets.MIMO_FDS_ENDPOINT }}
          MIMO_FDS_BUCKET: ${{ secrets.MIMO_FDS_BUCKET }}
          MIMO_FDS_PREFIX: ${{ secrets.MIMO_FDS_PREFIX }}

  publish:
    needs: [version, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Generate aggregate SHA256SUMS from uploaded assets
        run: |
          gh release download "$TAG" --repo "$GH_REPO" --dir release-assets --pattern 'oimo-*'
          bun script/checksums.ts release-assets/* > release-assets/SHA256SUMS
          gh release upload "$TAG" release-assets/SHA256SUMS --clobber --repo "$GH_REPO"

      - name: Publish npm packages and finalize release
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish (GitHub release assets are already uploaded). Add the NPM_TOKEN secret to the repository to enable npm publishing."
          else
            bun script/publish.ts
          fi
          if [ -n "$RELEASE_ID" ]; then
            gh release edit "$TAG" --draft=false --repo "$GH_REPO"
          fi
        env:
          MIMOCODE_VERSION: ${{ needs.version.outputs.version }}
          MIMOCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          RELEASE_ID: ${{ needs.version.outputs.release }}
